name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'astrbot==4.28.1' 'ruff==0.17.0'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: python -m unittest discover -s tests
