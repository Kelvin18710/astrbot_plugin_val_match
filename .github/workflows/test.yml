name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fonts and locales
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk locales
          sudo locale-gen en_US.UTF-8 zh_CN.UTF-8
      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'astrbot==4.28.1' 'ruff==0.17.0'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: python -m unittest discover -s tests
